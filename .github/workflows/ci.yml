name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev

      - name: Build Release
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -- -j2

      - name: Run smoketest (Release)
        run: |
          ./build/GameBoy --smoketest

      - name: Build Debug
        run: |
          mkdir -p build-debug && cd build-debug
          cmake .. -DCMAKE_BUILD_TYPE=Debug
          cmake --build . -- -j2

      - name: Run smoketest (Debug)
        run: |
          ./build-debug/GameBoy --smoketest
    
